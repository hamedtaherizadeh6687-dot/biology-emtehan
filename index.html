
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>آزمون آنلاین مطالعات اجتماعی </title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1 id="titr">  آزمون آنلاین مطالعات اجتماعی</h1>

    <!-- صفحه شروع -->
   <div id="start-screen">

    <h2>  دبیر : حامد طاهری زاده</h2>

    <input
      type="text"
        id="student-name"
        placeholder="نام و نام خانوادگی">


    <label id="paye" for="grade">پایه:</label>

    <select id="grade">

        <option class="paye" value="همه">همه پایه‌ها</option>
        <option value="    هفتم">هفتم</option>
        <option value="هشتم">هشتم</option>
        <option value="نهم">نهم</option>

    </select>


    <label id="dars" for="chapter">درس:</label>

    <select id="chapter">

        <option class="paye" value="همه">همه درس ها</option>
        <option value="درس 1">درس 1</option>
        <option value="درس 2">درس 2</option>
        <option value="درس 3">درس 3</option>
        <option value="درس 4">درس 4</option>
        <option value="درس 5">درس 5</option>
        <option value="درس 6">درس 6</option>
        <option value="درس 7">درس 7</option>
        <option value="درس 8">درس 8</option>
        <option value="درس 9">درس 9</option>
        <option value="درس 10">درس 10</option>
        <option value="درس 11">درس 11</option>
        <option value="درس 12">درس 12</option>
        <option value="درس 13">درس 13</option>
        <option value="درس 14">درس 14</option>
        <option value="درس 15">درس 15</option>
        <option value="درس 16">درس 16</option>
        <option value="درس 17">درس 17</option>
        <option value="درس 18">درس 18</option>
        <option value="درس 19">درس 19</option>
        <option value="درس 20">درس 20</option>
        <option value="درس 21">درس 21</option>
        <option value="درس 22">درس 22</option>
        <option value="درس 23">درس 23</option>
        <option value="درس 24">درس 24</option>

    </select>


    <label id="nums" for="question-count">
        تعداد سؤال:
    </label>

    <select id="question-count">

        
        <option value="20">20 سؤال</option>

    </select>


    <label for="exam-time">
        زمان آزمون:
    </label>

    <select id="exam-time">
 
        <option id="dag" value="1200">
            15 دقیقه
        </option>

    </select>


    <button class="start" onclick="startExam()">
        شروع آزمون  
    </button>

</div>


    <!-- صفحه آزمون -->
    <div id="quiz-screen">

        <div class="top">

            <span id="question-number">
                سؤال 1 از 3
            </span>

            <span id="timer">
                  15:00
            </span>

        </div>


        <div class="progress-container">

            <div id="progress-bar"></div>

        </div>


        <h2 id="question">
            متن سؤال
        </h2>


        <div id="options"></div>


        <button
            id="next-button"
            onclick="nextQuestion()">

            سؤال بعدی

        </button>

    </div>


    <!-- صفحه نتیجه -->
    <div id="result-screen">
          

        <h2>  آزمون تمام شد</h2>

        <p id="result-name"></p>

        <p id="result-score"></p>

        <button onclick="restartExam()">
            آزمون مجدد
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>      

</body>

</html>
