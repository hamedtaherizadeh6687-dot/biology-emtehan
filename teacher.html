<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>پنل معلم - آزمون زیست‌شناسی</title>


    <!-- فایل CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- SheetJS برای Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>


<body>


<div class="container">


    <!-- ========================= -->
    <!-- ورود معلم -->
    <!-- ========================= -->

    <div id="login-box">

        <h1>👨‍🏫 ورود معلم</h1>

        <p>
            برای ورود به پنل مدیریت، رمز عبور را وارد کنید.
        </p>

          <input
    type="email"
    id="teacher-email"
    placeholder="ایمیل معلم"
>

        <input
            type="password"
            id="teacher-password"
            placeholder="رمز عبور">


        <button onclick="teacherLogin()">
            ورود
        </button>
          
   <button onclick="forgotPassword()">
    🔑 فراموشی رمز عبور
</button>
          
          
    </div>



    <!-- ========================= -->
    <!-- پنل اصلی معلم -->
    <!-- ========================= -->

    <div id="teacher-panel"
         style="display:none;">

        <h1>
            👨‍🏫 پنل مدیریت معلم
        </h1>


        <hr>


        <!-- دکمه‌های اصلی -->

        <button onclick="showAddQuestion()">
            ➕ افزودن سؤال
        </button>


        <button onclick="showQuestions()">
            📋 مشاهده سؤال‌ها
        </button>


        <button onclick="showResults()">
            📊 مشاهده نتایج آزمون‌ها
        </button>


        <button onclick="showProgressPanel()">
            📈 نمودار پیشرفت
        </button>


        <button onclick="exportResultsToExcel()">
            📥 دریافت نتایج Excel
        </button>


        <button onclick="location.href='index.html'">
            🏠 بازگشت به آزمون
        </button>



        <!-- ========================= -->
        <!-- فرم افزودن سؤال -->
        <!-- ========================= -->

        <div id="add-question"
             style="display:none;">

            <h2>
                ➕ افزودن سؤال جدید
            </h2>


            <!-- نوع سؤال -->

            <label for="question-type">
                نوع سؤال:
            </label>


            <select
                id="question-type"
                onchange="changeQuestionType()">

                <option value="mcq">
                    چهارگزینه‌ای
                </option>

                <option value="truefalse">
                    صحیح / غلط
                </option>

                <option value="fillblank">
                    جای خالی
                </option>

                <option value="shortanswer">
                    کوتاه پاسخ
                </option>

                <option value="essay">
                    پاسخ کامل / تشریحی
                </option>

            </select>



            <!-- پایه -->

            <label for="teacher-grade">
                پایه:
            </label>


            <select id="teacher-grade">

                <option value="هفتم">
                    هفتم
                </option>

                <option value="هشتم">
                    هشتم
                </option>

                <option value="نهم">
                    نهم
                </option>

            </select>



            <!-- فصل -->

            <label for="teacher-chapter">
               درس:
            </label>


            <select id="teacher-chapter">

                <option value="درس 1و2">
                   درس 1 و 2
                </option>

                <option value="درس 3">
                   درس 3
                </option>

                <option value="درس 4  ">
                   درس 4
                </option>

                <option value="درس 5  ">
                   درس 5
                </option>

                <option value="درس 6  ">
                   درس 6
                </option>

                <option value="درس 7  ">
                   درس 7
                </option>

                <option value="درس 8  ">
                   درس 8
                </option>

                
                <option value="درس 9  ">
                   درس 9
                </option>


                <option value="10 درس ">
                   10 درس
                </option>


                <option value="درس 11  ">
                   درس 11
                </option>


                <option value="درس 12  ">
                   درس 12
                </option>


                <option value="13  ">
                   درس 13
                </option>


                <option value="درس 14  ">
                   درس 14
                </option>


                <option value="درس 15  ">
                   درس 15
                </option>


                <option value="درس 16  ">
                   درس 16
                </option>


                <option value="درس 17  ">
                   درس 17
                </option>


                <option value="درس 18  ">
                   درس 18
                </option>


                <option value="درس 19  ">
                   درس 19
                </option>


                <option value="درس 20  ">
                   درس 20
                </option>


                <option value="درس 21  ">
                   درس 21
                </option>


                <option value="درس 22  ">
                   درس 22
                </option>


                <option value="درس 23  ">
                   درس 23
                </option>


                <option value="درس 24  ">
                   درس 24
                </option>

            </select>



            <!-- متن سؤال -->

            <label for="teacher-question">
                متن سؤال:
            </label>


            <textarea
                id="teacher-question"
                placeholder="متن سؤال را وارد کنید">
            </textarea>



            <!-- ========================= -->
            <!-- گزینه‌های چهارگزینه‌ای -->
            <!-- ========================= -->

            <div id="options-box">

                <label>
                    گزینه ۱:
                </label>


                <input
                    type="text"
                    id="option-0"
                    placeholder="گزینه ۱">


                <label>
                    گزینه ۲:
                </label>


                <input
                    type="text"
                    id="option-1"
                    placeholder="گزینه ۲">


                <label>
                    گزینه ۳:
                </label>


                <input
                    type="text"
                    id="option-2"
                    placeholder="گزینه ۳">


                <label>
                    گزینه ۴:
                </label>


                <input
                    type="text"
                    id="option-3"
                    placeholder="گزینه ۴">

            </div>



            <!-- ========================= -->
            <!-- پاسخ -->
            <!-- ========================= -->

            <div id="answer-box">

                <label for="correct-answer">
                    پاسخ صحیح:
                </label>


                <select id="correct-answer">

                    <option value="0">
                        گزینه ۱
                    </option>

                    <option value="1">
                        گزینه ۲
                    </option>

                    <option value="2">
                        گزینه ۳
                    </option>

                    <option value="3">
                        گزینه ۴
                    </option>

                </select>

            </div>


           
<div id="essay-rubric-box" style="display: none; margin-top: 15px;">
    <h3>معیارهای تصحیح سؤال تشریحی</h3>
    <p>برای هر معیار، متن، کلیدواژه‌ها و نمره را وارد کنید.</p>

    <div class="rubric-item">
        <label>معیار اول:</label>
        <input type="text" id="rubric-criterion-1"
               placeholder="مثلاً توضیح فرایند فتوسنتز">

        <label>کلیدواژه‌های معیار اول:</label>
        <input type="text" id="rubric-keywords-1"
               placeholder="مثلاً نور، آب، گلوکز">

        <label>نمرهٔ معیار اول:</label>
        <input type="number" id="rubric-points-1"
               min="0" step="0.25" value="2">
    </div>

    <div class="rubric-item">
        <label>معیار دوم:</label>
        <input type="text" id="rubric-criterion-2"
               placeholder="مثلاً نقش نور در فتوسنتز">

        <label>کلیدواژه‌های معیار دوم:</label>
        <input type="text" id="rubric-keywords-2"
               placeholder="مثلاً نور، انرژی">

        <label>نمرهٔ معیار دوم:</label>
        <input type="number" id="rubric-points-2"
               min="0" step="0.25" value="2">
    </div>

    <div class="rubric-item">
        <label>معیار سوم:</label>
        <input type="text" id="rubric-criterion-3"
               placeholder="مثلاً نقش کلروفیل">

        <label>کلیدواژه‌های معیار سوم:</label>
        <input type="text" id="rubric-keywords-3"
               placeholder="مثلاً کلروفیل، سبزینه">

        <label>نمرهٔ معیار سوم:</label>
        <input type="number" id="rubric-points-3"
               min="0" step="0.25" value="1">
    </div>

    <p>نمرهٔ کل سؤال: ۵</p>
</div>



            <!-- ذخیره -->

            <button onclick="addQuestion()">
                💾 ذخیره سؤال
            </button>


            <!-- پاک کردن فرم -->

            <button onclick="clearQuestionForm()">
                🧹 پاک کردن فرم
            </button>

        </div>



        <!-- ========================= -->
        <!-- بانک سؤال -->
        <!-- ========================= -->

        <div id="question-list"
             style="display:none;">

            <h2>
                📋 بانک سؤال
            </h2>


            <div id="questions-container"></div>

        </div>



        <!-- ========================= -->
        <!-- نتایج آزمون -->
        <!-- ========================= -->

        <div id="results-panel"
             style="display:none;">

            <h2>
                📊 نتایج آزمون‌ها
            </h2>


            <div id="results-container"></div>

        </div>



        <!-- ========================= -->
        <!-- نمودار پیشرفت -->
        <!-- ========================= -->

        <div id="progress-panel"
             style="display:none;">

            <h2>
                📈 نمودار پیشرفت دانش‌آموز
            </h2>


            <label for="student-select">
                انتخاب دانش‌آموز:
            </label>


            <select
                id="student-select"
                onchange="showStudentChart()">

                <option value="">
                    -- یک دانش‌آموز انتخاب کنید --
                </option>

            </select>


            <div style="margin-top:30px;">

                <canvas id="progress-chart"></canvas>

            </div>

        </div>


    </div>

</div>



<!-- ========================= -->
<!-- JavaScript اصلی -->
<!-- ========================= -->

<script src="script.js"></script>


<script>

/*
    در شروع پنل افزودن سؤال،
    فرم را برای سؤال چهارگزینه‌ای آماده می‌کنیم.
*/

document.addEventListener("DOMContentLoaded", function () {

    if (typeof changeQuestionType === "function") {

        changeQuestionType();

    }

});

</script>


</body>

</html>
